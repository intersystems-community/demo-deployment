name: Demo Deploy

on:
  workflow_call:
    inputs:
      name:
        description: 'Domain name of deployment, before `.demo.community.intersystems.com`'
        required: true
        type: string
      namespace:
        description: 'Namespace to deploy to'
        required: false
        type: string
        default: demo
      memory:
        description: 'Memory for the instance'
        type: string
        default: 1Gi
      port:
        description: 'WebPort for the running instance'
        type: number
        default: 52773
      persistence:
        description: 'Set to true to keep IRIS data on persistent volumes across restarts.'
        required: false
        type: boolean
        default: false
    secrets:
      SERVICE_ACCOUNT_KEY:
        required: true
      CUSTOM_VARS_LIST:
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: 'Deploying repository'
        required: true
        type: string
      ref:
        description: 'Branch Name in deploying repository'
        required: true
        type: choice
        default: main
        options:
          - master
          - main
      name:
        description: 'Domain name of deployment, before `.demo.community.intersystems.com`'
        required: true
        type: string

env:
  # Change this section according to your needs
  IMAGE_NAME:   ${{ inputs.name }}
  DOMAIN_NAME:  ${{ inputs.name }}.demo.community.intersystems.com

# Leave this section untouched
  PROJECT_ID:     iris-community-demos
  CLUSTER_NAME:   demo
  GITHUB_SHA:     ${{ github.sha }}
  GITHUB_REPO:    ${{ github.repository }}
  REGION:         europe-west2
  NAMESPACE:      ${{ inputs.namespace }}
  SERVICE_PORT:   ${{ inputs.port }}
  SERVICE_MEMORY: ${{ inputs.memory }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}

    - name: Google Authentication
      uses: google-github-actions/auth@v3.0.0
      with:
        credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3.0.0
      with:
        project_id:   ${{ env.PROJECT_ID }}
        cluster_name: ${{ env.CLUSTER_NAME }}
        location:     ${{ env.REGION }}

    - name: Setup gcloud cli
      uses: google-github-actions/setup-gcloud@v3.0.1
      with:
        version: '588.0.0'

    - name: Authorize Docker push
      run: |
        gcloud --quiet auth configure-docker ${REGION}-docker.pkg.dev

    - name: Build and Push image
      run: |
        docker buildx build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/community/${IMAGE_NAME}:${GITHUB_SHA} --push .

    - name: Prepare Helm values
      id: prepare_helm_vars
      run: |
        if [[ "${{ inputs.persistence }}" == "true" ]]; then
          # Pin the original volume layout: ISC_DATA_DIRECTORY (/isc/data) must sit on a PVC, and
          # volumeClaimTemplates are immutable, so existing releases cannot move to the chart's /data.
          cat > deploy-values.yaml <<'EOF'
        persistence:
          enabled: true
          volumes:
          - {name: isc, storageClassName: standard, accessModes: [ReadWriteOnce], size: 10Gi, mountPath: /isc}
          - {name: wij, storageClassName: standard, accessModes: [ReadWriteOnce], size: 10Gi, mountPath: /wij}
          - {name: journal, storageClassName: standard, accessModes: [ReadWriteOnce], size: 10Gi, mountPath: /journal}
        initContainers:
        - name: volume-init
          image: busybox:1.38.0
          command: [sh, -c, "chown -R 51773:51773 /isc /wij /journal && chmod g+w /isc /wij /journal"]
        EOF
          INDEX=2
        else
          # No volumes: data lives in the container and is lost on restart. The chart's default
          # volume-init would chown volume paths that do not exist, so it is dropped too.
          cat > deploy-values.yaml <<'EOF'
        persistence:
          enabled: false
        initContainers: []
        EOF
          INDEX=1
        fi

        echo "[INFO] Escaping custom variables..."
        export CUSTOM_VARS_LIST_ESCAPED=$(echo "${{ secrets.CUSTOM_VARS_LIST }}" | sed -E 's/"/\\"/g')

        # extraEnv[0] is GITHUB_REPO (set in the deploy step); [1] is ISC_DATA_DIRECTORY with persistence.
        HELM_ARGS_STRING="--set-string 'extraEnv[0].name=GITHUB_REPO' --set-string 'extraEnv[0].value=${GITHUB_REPO}'"
        if [[ "${{ inputs.persistence }}" == "true" ]]; then
          HELM_ARGS_STRING="$HELM_ARGS_STRING --set-string 'extraEnv[1].name=ISC_DATA_DIRECTORY' --set-string 'extraEnv[1].value=/isc/data'"
        fi
        if [[ -n "$CUSTOM_VARS_LIST_ESCAPED" ]]; then
          echo "[INFO] CUSTOM_VARS_LIST_ESCAPED contains data. Parsing key-values..."
          IFS=',' read -r -a ENV_PAIRS <<< "$CUSTOM_VARS_LIST_ESCAPED"

          for PAIR in "${ENV_PAIRS[@]}"; do
            # Skip empty pairs
            if [[ -z "$PAIR" ]]; then
              continue
            fi

            # Check if the pair contains '='
            if [[ "$PAIR" != *"="* ]]; then
              echo "[WARNING] Skipping malformed pair (no '=')"
              continue
            fi

            # Split each pair into KEY and VALUE at the first '='
            KEY="${PAIR%%=*}"
            VALUE="${PAIR#*=}"
            echo "[INFO] Processing variable: KEY='$KEY'"

            # Only add if KEY is not empty (VALUE can be empty string)
            if [[ -n "$KEY" ]]; then
              HELM_ARGS_STRING="$HELM_ARGS_STRING --set-string 'extraEnv[$INDEX].name=$KEY' --set-string 'extraEnv[$INDEX].value=$VALUE'"
              ((INDEX++))
            else
              echo "[WARNING] Skipping empty key"
            fi
          done
        fi

        echo "helm_args=$HELM_ARGS_STRING" >> $GITHUB_OUTPUT

    - name: Deploy
      run: |
        echo "[INFO] Installing IRIS Helm charts repository..."
        helm repo add intersystems-charts https://charts.demo.community.intersystems.com

        echo "[INFO] Deploy Helm release..."
        helm upgrade --install ${{ inputs.name }} intersystems-charts/iris-app \
            --namespace ${NAMESPACE} \
            --version 0.0.8 \
            -f deploy-values.yaml \
            --set image.repository=${REGION}-docker.pkg.dev/${PROJECT_ID}/community/${IMAGE_NAME} \
            --set image.tag=${GITHUB_SHA} \
            --set resources.limits.memory=${SERVICE_MEMORY:-1Gi} \
            --set service.webPort=${SERVICE_PORT:-52773} \
            --set ingress.name=${{ inputs.name }} \
            --set ingress.domain=${DOMAIN_NAME} \
            --set externalSecret.enabled=false \
            ${{ steps.prepare_helm_vars.outputs.helm_args }} \
            --wait=legacy \
            --rollback-on-failure \
            --timeout 10m
